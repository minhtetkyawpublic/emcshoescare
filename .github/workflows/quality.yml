name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-static:
    name: React, Laravel, PWA, and release checks
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install locked dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Run release checks
        shell: powershell
        run: |
          try {
            .\scripts\release-check.ps1
          } catch {
            $message = $_.Exception.Message.Replace("`r", ' ').Replace("`n", ' ')
            Write-Output "::error title=Laravel release checks failed::$message"
            throw
          }

  api-integration:
    name: Laravel and MySQL order workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:aKaKq6c/SvWzglrYtL17pl0hG6/mC79yF/466Z7eEdE=
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: emc_shoes_care
      DB_USERNAME: root
      DB_PASSWORD: ''
      SESSION_DRIVER: database
      SESSION_LIFETIME: 43200
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      EMC_ALLOWED_ORIGINS: http://127.0.0.1:8080

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: emc_shoes_care
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, pdo_mysql
          coverage: none

      - name: Install locked Laravel dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run database migrations
        shell: pwsh
        run: |
          php artisan migrate --seed --force
          php artisan migrate:status
          php artisan migrate --force

      - name: Create temporary administrator and start API
        shell: bash
        run: |
          php artisan emc:create-admin emcaudit 'EMC-Release-Audit-2026!' 'Release Audit'
          php artisan serve --host=127.0.0.1 --port=8080 > "$RUNNER_TEMP/emc-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emc-api.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emc-api.log"
          exit 1

      - name: Run complete customer and administrator workflow
        shell: pwsh
        run: |
          try {
            ./tests/e2e-local.ps1 `
              -AdminUsername emcaudit `
              -AdminPassword 'EMC-Release-Audit-2026!' `
              -BaseUrl http://127.0.0.1:8080/api `
              -MySqlClient mysql `
              -MySqlHost 127.0.0.1 `
              -CurlClient curl
          } catch {
            $message = $_.Exception.Message.Replace("`r", ' ').Replace("`n", ' ')
            Write-Output "::error title=EMC integration workflow failed::$message"
            throw
          }

      - name: Show API log after failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/emc-api.log" || true

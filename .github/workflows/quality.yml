name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-static:
    name: React, PHP, PWA, and release checks
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, pdo_mysql
          coverage: none

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        shell: powershell
        run: .\scripts\release-check.ps1

  api-integration:
    name: PHP and MySQL order workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, pdo_mysql
          coverage: none

      - name: Import database migrations
        shell: bash
        run: |
          for migration in database/migrations/*.sql; do
            docker exec -i "${{ job.services.mysql.id }}" mysql --user=root < "$migration"
          done

      - name: Create temporary administrator and start API
        shell: bash
        run: |
          php api/cli/create-admin.php emcaudit 'EMC-Release-Audit-2026!' 'Release Audit'
          php -S 127.0.0.1:8080 api/index.php > "$RUNNER_TEMP/emc-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emc-api.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emc-api.log"
          exit 1

      - name: Run complete customer and administrator workflow
        shell: pwsh
        run: |
          try {
            ./tests/e2e-local.ps1 `
              -AdminUsername emcaudit `
              -AdminPassword 'EMC-Release-Audit-2026!' `
              -BaseUrl http://127.0.0.1:8080 `
              -MySqlClient mysql `
              -MySqlHost 127.0.0.1 `
              -CurlClient curl
          } catch {
            $message = $_.Exception.Message.Replace("`r", ' ').Replace("`n", ' ')
            Write-Output "::error title=EMC integration workflow failed::$message"
            throw
          }

      - name: Show API log after failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/emc-api.log" || true
